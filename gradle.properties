org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
# Only what the mod is built and tested on: 1.20.2 and Forge 48 changed the saved-data and player APIs it calls, and a
# range that admits them crashes at load instead of saying so. 47.4.0 is the Forge the README asks for and the build uses.
minecraft_version_range=[1.20.1]
forge_version=47.4.0
forge_version_range=[47.4,48)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

mod_id=qrcraft
mod_name=QrCraft
# The same placeholder as the README's License section, until a licence is chosen.
mod_license=To be decided
mod_version=0.1.0
mod_group_id=io.github.simonerecchia.qrcraft
mod_authors=SimoneRecchia
mod_description=Turns any text, link or book into a QR code on a map you can hang in an item frame. Server-side only: players join without installing it.
