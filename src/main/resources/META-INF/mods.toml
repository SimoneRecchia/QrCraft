modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SimoneRecchia/QrCraft/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/SimoneRecchia/QrCraft"
authors="${mod_authors}"
logoFile="assets/qrcraft/icon.png"
description='''${mod_description}'''
# The mod lives on the server alone: a client without it - vanilla, or Forge without QrCraft - joins, and the server
# list shows no red cross. QrCraft.java keeps it true by registering nothing a client would have to know.
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
