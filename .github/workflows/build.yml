name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push to the same branch makes an in-flight pr build obsolete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'microsoft'
      # caches the forge userdev artifacts and the decompiled minecraft sources,
      # which otherwise get rebuilt from scratch on every run
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
          if-no-files-found: error

      # the jar just built, on a real forge server, against a vanilla client: the mod's whole promise is that players
      # join without it, which no unit test can show. e2e/run.sh says what it checks
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: install the end-to-end test
        run: npm ci --prefix e2e
      - name: end-to-end test on a forge server
        run: e2e/run.sh
      - name: keep the server's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: |
            e2e/server/logs/
            e2e/server/console.log
            e2e/server/crash-reports/
          if-no-files-found: ignore
